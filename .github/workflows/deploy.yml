name: deploy Laravel App

# env:
#   # Use the same ssh-agent socket value across all jobs
#   # Useful when a GH action is using SSH behind-the-scenes
#   SSH_AUTH_SOCK: /tmp/ssh_agent.sock

on:
  push:
    branches: 
      - release

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: 8.4

    - name: Install Composer Dependencies
      run: composer install --optimize-autoloader --no-dev --no-progress --no-interaction --prefer-dist

    - name: Install Node
      uses: actions/setup-node@v3
      with:
        node-version: '20'

    - name: Install NPM Dependencies
      run: npm install

    - name: Build NPM Assets
      run: npm run build

    - name: Synchronize Files To Server
      uses: easingthemes/ssh-deploy@v2.1.5
      env:
        SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        SOURCE: "."
        REMOTE_HOST: ${{ secrets.VPS_HOST }}
        REMOTE_USER: ${{ secrets.VPS_USER }}
        TARGET: ${{ secrets.DEPLOY_SERVER_DIR }}

    - name: Run Remote/Artisan Commands
      uses: appleboy/ssh-action@v0.1.6
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          set -euo pipefail
          echo "--- SSH remote diagnostics ---"
          echo "User: $(whoami)"
          echo "Home: $HOME"
          echo "Starting directory: $(pwd)"
          cd ${{ secrets.DEPLOY_SERVER_DIR }}
          echo "Deploy dir: $(pwd)"
          ls -la || true

          echo "Checking PHP availability and SAPI"
          if command -v php >/dev/null 2>&1; then
            PHP_BIN=$(command -v php)
            echo "php: $PHP_BIN"
            "$PHP_BIN" -v || true
            "$PHP_BIN" -r 'echo PHP_SAPI . "\n";' || true
          else
            echo "php not found in PATH"
            PHP_BIN=""
          fi

          echo "Ensure vendor/autoload.php exists or run composer on remote"
          if [ ! -f vendor/autoload.php ]; then
            echo "vendor not present"
            if command -v composer >/dev/null 2>&1; then
              echo "Running composer install on remote (no-dev, optimize)"
              composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist || true
            else
              echo "composer not found on remote. Either deploy vendor/ or install composer."
            fi
          else
            echo "vendor present"
          fi

          if [ ! -f artisan ]; then
            echo "artisan not found in $PWD" >&2
            exit 1
          fi

          if [ -n "$PHP_BIN" ]; then
            echo "Running artisan migrate and optimize using $PHP_BIN"
            "$PHP_BIN" artisan migrate --force
            "$PHP_BIN" artisan optimize
          else
            echo "No php CLI binary available; aborting artisan commands" >&2
            exit 1
          fi